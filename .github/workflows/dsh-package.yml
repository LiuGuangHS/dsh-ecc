name: DSH Package

on:
  push:
    branches: [main]
    tags:
      - "dsh-v*"
    paths:
      - "dsh/**"
      - "skills/**"
      - "tests/dsh/**"
      - ".github/workflows/dsh-package.yml"
  pull_request:
    paths:
      - "dsh/**"
      - "skills/**"
      - "tests/dsh/**"
      - ".github/workflows/dsh-package.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify DSH package
        working-directory: dsh
        run: npm test

      - name: Check package contents
        working-directory: dsh
        run: npm pack --dry-run --ignore-scripts

  publish:
    if: startsWith(github.ref, 'refs/tags/dsh-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish with npm Trusted Publishing
        working-directory: dsh
        run: npm publish --provenance --access public
